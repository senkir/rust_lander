[package]
name = "Rust-Lander"
version = "0.1.0"

#cargo edition not project edition
edition = "2024"

[dependencies]
bevy = { version = "0.20.1",
    default-features = false,
    features = ["2d", "file_watcher"] }
rand = "0.10.3"
# localization
fluent = "0.17.0"
# physics
avian2d = "0.8"
#particle manager
bevy_enoki = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }